name: Android Companion

on:
  push:
    branches:
      - feature/android-companion-seabank
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP for backend syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Check PHP syntax
        run: |
          php -l api.php
          php -l companion.php
          php -l inc/companion.php

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        working-directory: android-companion
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android-companion
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uang-companion-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
